name: Crypto paper trading

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use mock Claude decisions even if the API key is set"
        type: boolean
        default: false
      reset:
        description: "Archive the crypto state and start every portfolio fresh"
        type: boolean
        default: false

permissions:
  contents: write

# Shared with the stocks workflow so two runs never write state at the same time.
concurrency:
  group: paper-trader-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_RESET: ${{ inputs.reset }}
        run: |
          args=(--market crypto)
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$INPUT_RESET" = "true" ]; then args+=(--reset); fi
          python -m bot.main "${args[@]}"

      - name: Build dashboard data
        if: always()
        run: python -m bot.report

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state archive docs/data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "crypto run $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            echo "Push attempt $attempt failed, retrying."
            sleep $((attempt * 5))
          done
          exit 1

      # Pushes made with GITHUB_TOKEN do not trigger a Pages build, so deploy docs/ here.
      - name: Upload dashboard
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
